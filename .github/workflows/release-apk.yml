name: Build and Sign Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure dummy .env exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Prepare Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > cardbox-release-key.jks
          else
            echo "Using existing repository Keystore file..."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: cardbox-release-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'CardBoxPOS@2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'cardbox-pos-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'CardBoxPOS@2026' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease -x test --no-daemon --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardbox-pos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
