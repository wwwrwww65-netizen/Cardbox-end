name: Build and Sign Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore File
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > cardbox-release-key.jks
          else
            echo "Using existing repository Keystore file..."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: cardbox-release-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'CardBoxPOS@2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'cardbox-pos-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'CardBoxPOS@2026' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardbox-pos-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
